<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

main{max-width:560px;margin:0 auto;padding:12px 16px 110px}

.desc{margin-top:4px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}

.rt{margin:14px 0 4px;font-size:19px}.rt2{margin:16px 0 6px;font-size:16px;color:var(--mute)}

.bars{display:grid;gap:6px}.br{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:13px}.br i{display:block;height:12px;border-radius:6px;background:var(--main);min-width:2px}

.paper *{box-sizing:border-box}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:14px;border-bottom:3px solid #0f5c4d}
.pn1{font-size:28px;font-weight:800;color:#0f5c4d;line-height:1.25}.pn2{font-size:16px;font-weight:600}.pn3{font-size:13px;color:#52625d}
.pr{display:grid;gap:6px;justify-items:end;text-align:left}.pbadge{background:#0f5c4d;color:#fff;font-size:20px;font-weight:700;padding:6px 22px;border-radius:8px}
.pc{display:flex;flex-wrap:wrap;gap:8px 28px;margin:16px 0;padding:12px 14px;background:#f1f6f4;border:1px solid #d5e1dc;border-radius:10px}
.pc small,.pf small,.psum small{display:block;font-size:12px;color:#52625d}.pc b{font-size:17px}
.pt{width:100%;border-collapse:collapse;font-size:14px}
.pt th{background:#0f5c4d;color:#fff;padding:9px 8px;font-weight:700;text-align:center}
.pt td{padding:8px;border-bottom:1px solid #d5e1dc;text-align:center;vertical-align:middle}
.pt tbody tr:nth-child(even){background:#f7faf9}.pt td.tl{text-align:start}
.pt .r{color:#b3402a;font-weight:700}.pt .g{color:#0f7a52;font-weight:700}.pt .bl{font-weight:700}.pt td small{font-size:11px;color:#52625d;margin-right:4px;font-weight:600}
.pt tr.tot td{background:#e3eeea;font-weight:800;border-top:2px solid #0f5c4d}
.pf{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;padding:12px 14px;border:2px solid #0f5c4d;border-radius:10px;flex-wrap:wrap}
.pf b{font-size:24px}.pf b.r{color:#b3402a}.pf b.g{color:#0f7a52}.pw{font-size:14px;font-weight:700;color:#0f5c4d}
.paper .ps{font-size:12px;color:#52625d}
.pnote{margin-top:14px;min-height:60px;border:1px solid #d5e1dc;border-radius:10px;padding:8px 12px;color:#52625d}
.pfoot{margin-top:14px;text-align:center;font-size:11px;color:#8a9a95}
.psum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.psum div{border:1px solid #d5e1dc;border-radius:10px;padding:8px 10px;background:#f1f6f4}.psum b{font-size:19px}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.pbar .btn{padding:11px 4px;font-size:14px}
@media print{.pv{height:auto!important;box-shadow:none}.paper{transform:none!important;width:100%!important;padding:0}.pbar{display:none!important}}
.acbar{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 2px;margin:8px 0}
.ac{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;line-height:1.25;padding:4px 2px;cursor:pointer;text-decoration:none;text-align:center;overflow-wrap:anywhere;word-break:break-word}
.ac i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--c);background:var(--soft);background:color-mix(in srgb,var(--c) 15%,transparent)}
.ac.n{--c:#b9770e}.ac.g{--c:#0f8a4f}.ac.b{--c:#2f6fd0}.ac.r{--c:#c0392b}.ac.p{--c:#7048d8}.ac.t{--c:#0f7a8a}
:root[data-theme="dark"] .ac.n{--c:#f0b429}:root[data-theme="dark"] .ac.g{--c:#5ad19a}:root[data-theme="dark"] .ac.b{--c:#7aaeff}:root[data-theme="dark"] .ac.r{--c:#f08a72}:root[data-theme="dark"] .ac.p{--c:#b39bff}:root[data-theme="dark"] .ac.t{--c:#5cc7d6}
.cnote{display:block;width:100%;text-align:start;margin:0 0 8px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-right:3px solid #d99a1c;border-radius:10px;color:var(--ink);font:inherit;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer}
.k.eq2{grid-row:span 2;background:var(--main);color:var(--onmain);border-color:var(--main);font-weight:700}
</style>

<body>
<main id="app"></main>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script>
const SK='daftari-synced',KEY='daftari-v2',OLD='sales-debts-v1',EK='daftari-email';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let seq=0;const uid=()=>Date.now()*100+(seq++%100);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const em=()=>lsGet(EK)||'';
let db={customers:[],tx:[],notes:[]},V={n:'home',id:null},TAB='cust',S={},cloud=null,pushT=null,SYNC=null;
const save=()=>{db.rev=Date.now();lsSet(KEY,JSON.stringify(db));push()};
function migrate(o){
 if(o.tx){o.customers=o.customers||[];o.notes=o.notes||[];return o}
 const n={customers:[],tx:[],notes:o.notes||[]};
 const cu=(name,phone,loc)=>{name=(name||'').trim();if(!name)return null;let c=n.customers.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!c){c={id:uid(),name,phone:phone||'',loc:loc||''};n.customers.push(c)}return c.id};
 (o.sales||[]).forEach(s=>n.tx.push({id:uid(),cid:cu(s.cust,s.phone,s.loc),kind:'sale',dir:null,item:s.item||'',amt:s.amt,date:s.date}));
 (o.debts||[]).forEach(d=>{const c=cu(d.person,d.phone,d.loc),dir=d.type==='lent'?'gave':'took';
  n.tx.push({id:uid(),cid:c,kind:'debt',dir,item:d.note||'',amt:d.amt,date:d.date});
  if(d.paid>0)n.tx.push({id:uid(),cid:c,kind:'debt',dir:dir==='gave'?'took':'gave',item:'دفعة',amt:d.paid,date:d.date})});
 return n}
(()=>{try{const r=lsGet(KEY);if(r){db=migrate(JSON.parse(r));return}const o=lsGet(OLD);if(o){db=migrate(JSON.parse(o));save()}}catch(e){}})();

const bal=cid=>db.tx.filter(t=>t.cid==cid&&t.kind==='debt').reduce((a,t)=>a+(t.dir==='gave'?t.amt:-t.amt),0);
function totals(){let L=0,B=0;db.customers.forEach(c=>{const b=bal(c.id);if(b>0)L+=b;else B-=b});
 const TS=db.tx.filter(t=>t.kind==='sale').reduce((a,t)=>a+t.amt,0);return{L,B,TS,T:TS+L-B}}
const find=nm=>db.customers.find(c=>c.name.toLowerCase()===nm.toLowerCase());
function ensure(nm,ph,lc){let c=find(nm);if(c){if(ph&&!c.phone)c.phone=ph;if(lc&&!c.loc)c.loc=lc;return c.id}
 c={id:uid(),name:nm,phone:ph,loc:lc};db.customers.push(c);return c.id}
const LOGO='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38"><defs><linearGradient id="dfG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a9078"/><stop offset="1" stop-color="#0a4538"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#dfG)"/><path d="M12 19c7-2.6 14-1.4 20 3 6-4.4 13-5.6 20-3v29c-7-2.6-14-1.4-20 3-6-4.4-13-5.6-20-3z" fill="#fff"/><path d="M32 22v29" stroke="#0f5c4d" stroke-opacity=".3" stroke-width="1.6"/><path d="M17 27h9M17 32h9M17 37h6M38 27h9M38 32h6" stroke="#0f5c4d" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/><path d="M24 12h8v15l-4-3-4 3z" fill="#f2b632"/><circle cx="46" cy="44" r="9" fill="#f2b632" stroke="#fff" stroke-width="2.4"/><path d="M46 39.5v9M41.5 44h9" stroke="#0a4538" stroke-width="2.6" stroke-linecap="round"/></svg>';
const PLUSU='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M19 8v6M16 11h6"/></svg>';
const ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

const IK='daftari-img';let IMG={};try{IMG=JSON.parse(lsGet(IK)||'{}')||{}}catch(e){IMG={}}
const imgSave=()=>{try{localStorage.setItem(IK,JSON.stringify(IMG));return true}catch(e){return false}};
function readImg(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)})}
const prevHtml=()=>S.img?`<img class="thumb" src="${S.img}" alt="معاينة الصورة"><button type="button" class="ghost" data-a="rmimg">إزالة</button>`:'';

${L.length?`<div class="acts"><button class="ghost" data-a="ncopyall">نسخ الكل</button><button class="ghost" data-a="ncutall">نسخ الكل وحذفها</button></div>`+L.map((n,i)=>`<div class="item note"><span class="num">${i+1}</span><span class="nt">${esc(n.t)}</span><button class="ic" data-a="ncopy" data-i="${n.id}" aria-label="نسخ">${ICON}</button><button class="ic" data-a="ncut" data-i="${n.id}" aria-label="نسخ وحذف">✂</button><button class="ic" data-a="ndel" data-i="${n.id}" aria-label="حذف">×</button></div>`).join(''):'<p class="empty">لا توجد ملاحظات.</p>'}`}
const nSorted=()=>[...db.notes].sort((a,b)=>a.id-b.id);
const nLine=(n,i)=>(i+1)+'. '+n.t;
async function noteCopy(id,cut){const L=nSorted(),i=L.findIndex(x=>x.id==id);if(i<0)return;
 if(await copyText(nLine(L[i],i))){if(cut){db.notes=db.notes.filter(x=>x.id!=id);save();render()}toast(cut?'تم النسخ والحذف':'تم النسخ')}else toast('تعذّر النسخ')}
async function noteAll(cut){const L=nSorted();if(!L.length)return;
 if(await copyText(L.map(nLine).join('\n'))){if(cut){db.notes=[];save();render()}toast(cut?'تم النسخ والحذف':'تم النسخ')}else toast('تعذّر النسخ')}

function calc(s){let t=s.match(/[0-9]*[.]?[0-9]+|[-+*/]/g)||[];while(t.length&&/^[-+*/]$/.test(t[t.length-1]))t.pop();if(!t.length)return 0;
 const a=[];for(let i=0;i<t.length;i++){if(t[i]==='-'&&(i===0||/^[-+*/]$/.test(t[i-1]))&&i+1<t.length){a.push(String(-t[++i]))}else a.push(t[i])}
 const b=[a[0]];for(let i=1;i<a.length;i+=2){const op=a[i],n=+a[i+1];if(op==='*')b.push(String(+b.pop()*n));else if(op==='/')b.push(String(+b.pop()/n));else b.push(op,a[i+1])}
 let r=+b[0];for(let i=1;i<b.length;i+=2){r=b[i]==='+'?r+(+b[i+1]):r-(+b[i+1])}return r}
let ex='';const isOp=c=>'+-*/'.includes(c);
const shown=s=>s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
function calcView(){return `<header class="hd"><button class="ib" data-a="back" aria-label="رجوع">→</button><h1>الحاسبة</h1></header><div class="calc"><div class="disp" id="cDisp" dir="ltr"></div><div class="cres" id="cRes" dir="ltr"></div><div class="keys" dir="ltr">${'C ⌫ ÷ × 7 8 9 − 4 5 6 + 1 2 3 = 0 00 .'.split(' ').map(k=>`<button class="k${'÷×−+'.includes(k)?' op':''}${k==='='?' eq2':''}${k==='C'||k==='⌫'?' fn':''}" data-a="k" data-i="${k}">${k}</button>`).join('')}</div><div class="acts" style="margin-top:10px"><button class="ghost" data-a="ccopy">نسخ النتيجة</button></div></div>`}
function draw(){$('#cDisp').textContent=ex?shown(ex):'0';let p='';if(ex.slice(1).split('').some(isOp)){const r=calc(ex);if(isFinite(r))p='= '+(+r.toFixed(10))}$('#cRes').textContent=p}
function press(k){
 if(k==='C')ex='';else if(k==='⌫')ex=ex.slice(0,-1);
 else if(k==='='){if(!ex)return;const r=calc(ex);if(!isFinite(r)){ex='';draw();$('#cDisp').textContent='خطأ';return}ex=String(+r.toFixed(10))}
 else{const m={'÷':'/','×':'*','−':'-'}[k]||k;
  if(isOp(m)){if(!ex&&m!=='-')return;ex=isOp(ex.slice(-1))?ex.slice(0,-1)+m:ex+m}
  else if(m==='.'){const seg=ex.split(/[-+*/]/).pop();if(seg.includes('.'))return;ex+=seg?'.':'0.'}
  else{const seg=ex.split(/[-+*/]/).pop(),d=(m==='00'&&(!seg||seg==='0'))?'0':m;ex=seg==='0'?ex.slice(0,-1)+d:ex+d}}
 draw()}

const unshow=s=>s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
function kpUpdate(){const x=unshow($('#fAmt').value),has=x.slice(1).split('').some(isOp),r=has?calc(x):NaN,b=$('#kpSave');
 if(has&&isFinite(r)){b.hidden=false;b.textContent='✓ حفظ القيمة = '+(+r.toFixed(10))}else b.hidden=true}
function kpKey(k){const f=$('#fAmt');let x=unshow(f.value);f.classList.remove('bad');
 if(k==='C')x='';else if(k==='⌫')x=x.slice(0,-1);
 else{const m={'÷':'/','×':'*','−':'-'}[k]||k;
  if(isOp(m)){if(!x&&m!=='-')return;x=isOp(x.slice(-1))?x.slice(0,-1)+m:x+m}
  else if(m==='.'){const seg=x.split(/[-+*/]/).pop();if(seg.includes('.'))return;x+=seg?'.':'0.'}
  else{const seg=x.split(/[-+*/]/).pop(),d=(m==='00'&&(!seg||seg==='0'))?'0':m;x=seg==='0'?x.slice(0,-1)+d:x+d}}
 f.value=shown(x);kpUpdate()}

 tab:i=>{TAB=i;render()},

 ncopy:i=>noteCopy(i,0),ncut:i=>noteCopy(i,1),ndel:i=>{db.notes=db.notes.filter(n=>n.id!=i);save();render()},

 k:press,
 amt:()=>{$('#kp').hidden=false;kpUpdate()},kk:kpKey,kdone:()=>{$('#kp').hidden=true},
 kpsave:()=>{const f=$('#fAmt'),r=calc(unshow(f.value));if(isFinite(r)){f.value=String(+r.toFixed(10));kpUpdate()}},
 ccopy:async()=>{const r=calc(ex);if(!ex||!isFinite(r))return;toast(await copyText(String(+r.toFixed(10)))?'تم نسخ النتيجة':'تعذّر النسخ')}
};

{const mq=matchMedia('(prefers-color-scheme: dark)'),ap=()=>{document.documentElement.dataset.theme=mq.matches?'dark':'light'};ap();mq.addEventListener?mq.addEventListener('change',ap):mq.addListener&&mq.addListener(ap)}
